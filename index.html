<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Ops Global - Reproductor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: #ff3333;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header p {
            color: #8b9bb4;
            font-size: 0.9rem;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            background: #131b2e;
            border: 2px solid #ff3333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
        }
        .video-wrapper iframe, 
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-section {
            padding: 20px;
        }
        .info-section h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        .info-section p {
            color: #b0c4de;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Shadow Ops Global</h1>
        <p>Transmisión Segura - Zona de Cine</p>
    </header>

    <div class="player-container">
        <!-- Contenedor del video -->
        <div class="video-wrapper">
            <!-- REEMPLAZA EL ENLACE DE ABAJO por el de tu video (YouTube, Google Drive embebido, MP4 directo, etc.) -->
            <iframe src="https://www.youtube.com/embed/TU_VIDEO_ID" allowfullscreen></iframe>
        </div>
        <div class="info-section">
            <h2>Depredador (Última Entrega)</h2>
            <p>Misión de alto riesgo en la selva. Mantén los ojos abiertos y el volumen alto.</p>
        </div>
    </div>

</body>
</html>
